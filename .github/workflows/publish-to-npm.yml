# This workflow will run tests using node and then publish a package to NPM when a tag is pushed
# For more information see: https://docs.github.com/en/actions/publishing-packages/publishing-nodejs-packages

# Edited according to OIDC requirements of NPM Documentation
# See: https://docs.npmjs.com/trusted-publishers#supported-cicd-providers

# Workflow name and description
name: Publish to NPM
description: Publish the package to NPM when a tag is pushed

# Define the events that trigger the workflow
on:
  push:
    # Trigger when a tag is pushed with "v*" pattern
    tags:
      - 'v*'

# Permissions required for the workflow
permissions:
  # Required for OIDC authentication with NPM
  id-token: write
  # Required to read the repository contents
  contents: read

# Different jobs for the workflow
jobs:
  # Build and test the package
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm test

  # Publish the package to NPM after successful build and tests
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          # Disable caching for the package manager (npm documentation recommends this for CI/CD)
          package-manager-cache: false
      - run: npm ci
      - run: npm run build --if-present
      - run: npm test
      - run: npm publish
